<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fraction → Decimal Flashcards (3rd–4th Grade)</title>
  <style>
    :root{
      --bg:#cbc1c3; --card:#ffffff; --accent:#2b7cff; --muted:#6b7280;
      --success:#16a34a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    body{margin:0;background:var(--bg);color:#0f172a;display:flex;flex-direction:column;min-height:100vh;align-items:center;padding:28px;}
    header{max-width:900px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    select,button,input[type="checkbox"]{font-size:14px;padding:8px;border-radius:8px;border:1px solid #d1d5db;background:white}
    .container{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
    .card{perspective:1000px;}
    .inner{width:100%;height:160px;position:relative;transform-style:preserve-3d;transition:transform .6s;}
    .card.flip .inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;border-radius:12px;background:var(--card);box-shadow:0 6px 18px rgba(2,6,23,.08);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px;}
    .front{font-size:28px;font-weight:700;flex-direction:column;gap:6px}
    .back{transform:rotateY(180deg);flex-direction:column;gap:8px;text-align:center}
    .fraction{font-size:36px;font-weight:800}
    .decimal{font-size:32px;color:var(--accent);font-weight:700}
    .explain{font-size:14px;color:var(--muted)}
    .small{font-size:13px;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center}
    .mode-toggle button{padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;background:white;cursor:pointer}
    .active{background:var(--accent);color:white;border-color:var(--accent)}
    .score{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(43,124,255,.12);color:var(--accent);font-weight:600}
    @media (max-width:520px){ .inner{height:140px} .fraction{font-size:28px} .decimal{font-size:24px} }
  </style>
</head>
<body>
  <header>
    <h1>Fraction → Decimal Flashcards — 3rd & 4th Grade</h1>
    <div class="controls">
      <label class="row">
        <span class="small">Difficulty</span>
        <select id="difficulty" title="Difficulty">
          <option value="easy">Easy (halves, fourths, thirds)</option>
          <option value="medium" selected>Medium (common denominators 2–8)</option>
          <option value="hard">Hard (denominators up to 12, improper)</option>
        </select>
      </label>

      <button id="newSet">New Set</button>

      <div class="row"><span class="score" id="progress">0 / 0</span></div>
    </div>
  </header>

  <main class="container" id="cards"></main>

  <footer>
    Tip: Click or tap a card to flip. Use difficulty to change fraction types.
  </footer>

  <script>
    // Utilities
    function gcd(a,b){return b?gcd(b,a%b):Math.abs(a);}
    function simplify(n,d){const g=gcd(n,d);return [n/g,d/g];}
    function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
    function toDecimal(n,d,places=3){ return (n/d).toFixed(places); }

    // Generate fraction based on difficulty
    function generateFraction(difficulty){
      const maxDen = difficulty==='easy'?4 : difficulty==='medium'?8 : 12;
      const allowImproper = difficulty==='hard';
      let denom, numer;
      // Favor simple denominators for easy
      if(difficulty==='easy'){
        const choices=[2,3,4];
        denom = choices[randInt(0,choices.length-1)];
        numer = randInt(1, denom - 1);
      } else {
        denom = randInt(2, maxDen);
        numer = randInt(1, allowImproper ? denom + 2 : denom - 1);
      }
      const [sn, sd] = simplify(numer, denom);
      return {numer: sn, denom: sd, rawNumer: numer, rawDenom: denom};
    }

    // Build a card object
    function generateCard(difficulty){
      const f = generateFraction(difficulty);
      const decimal = toDecimal(f.rawNumer, f.rawDenom, 3);
      return {
        front: `${f.numer}/${f.denom}`,
        back: decimal,
        explanation: `${f.rawNumer}/${f.rawDenom} = ${decimal} (rounded to 3 decimals)`
      };
    }

    // DOM
    const cardsEl = document.getElementById('cards');
    const progressEl = document.getElementById('progress');
    const difficultyEl = document.getElementById('difficulty');
    const newSetBtn = document.getElementById('newSet');

    let cardData = [];
    let revealed = 0;
    let knownCount = 0;

    function makeSet(count=8){
      cardData = [];
      revealed = 0;
      knownCount = 0;
      for(let i=0;i<count;i++) cardData.push(generateCard(difficultyEl.value));
      renderCards();
      updateProgress();
    }

    function renderCards(){
      cardsEl.innerHTML = '';
      cardData.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-idx', idx);
        card.innerHTML = `
          <div class="inner" role="button" tabindex="0" aria-pressed="false">
            <div class="face front">
              <div class="fraction">${c.front}</div>
              <div class="small">Tap to see decimal</div>
            </div>
            <div class="face back">
              <div class="decimal">${c.back}</div>
              <div class="explain">${c.explanation}</div>
              <div style="margin-top:8px;">
                <button class="showAgain">Show again</button>
                <button class="markKnown" style="margin-left:6px;background:var(--success);color:white;border:none;padding:8px;border-radius:8px;cursor:pointer">I know this</button>
              </div>
            </div>
          </div>`;
        const inner = card.firstElementChild;
        inner.addEventListener('click', ()=> {
          card.classList.toggle('flip');
          const pressed = inner.getAttribute('aria-pressed') === 'true';
          inner.setAttribute('aria-pressed', String(!pressed));
          if(card.classList.contains('flip')) {
            if(!card.classList.contains('revealed')){
              card.classList.add('revealed');
              revealed++;
              updateProgress();
            }
          }
        });
        inner.addEventListener('keydown', (e)=>{
          if(e.key==='Enter' || e.key===' '){ e.preventDefault(); inner.click(); }
        });
        card.querySelector('.showAgain').addEventListener('click', (ev)=>{
          ev.stopPropagation();
          card.classList.remove('flip');
        });
        card.querySelector('.markKnown').addEventListener('click', (ev)=>{
          ev.stopPropagation();
          if(!card.classList.contains('known')){
            card.classList.add('known');
            card.style.opacity = '0.45';
            card.style.filter = 'grayscale(.2)';
            knownCount++;
            updateProgress();
          }
        });
        cardsEl.appendChild(card);
      });
    }

    function updateProgress(){
      progressEl.textContent = `Seen: ${revealed} / ${cardData.length}  •  Known: ${knownCount}`;
    }

    difficultyEl.addEventListener('change', ()=> makeSet(8));
    newSetBtn.addEventListener('click', ()=> makeSet(8));

    makeSet(8);
  </script>
</body>
</html>
