<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Algebra & Precalculus Flashcards</title>
  <style>
    :root{
      --bg:#adbbd7; --card:#fff; --accent:#1366d6; --muted:#6b7280; --ok:#16a34a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body{margin:0;background:var(--bg);color:#0b1220;display:flex;flex-direction:column;min-height:100vh;align-items:center;padding:24px;}
    header{max-width:1100px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    h1{font-size:18px;margin:0}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    select,button,input{font-size:14px;padding:8px;border-radius:8px;border:1px solid #d1d5db;background:white}
    .container{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr;gap:14px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .deck-btn{padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;background:white;cursor:pointer}
    .deck-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{perspective:1000px;}
    .inner{width:100%;height:160px;position:relative;transform-style:preserve-3d;transition:transform .6s;}
    .card.flip .inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;border-radius:12px;background:var(--card);box-shadow:0 6px 18px rgba(2,6,23,.08);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;padding:12px;flex-direction:column;gap:8px}
    .front{font-size:18px;font-weight:700;text-align:center}
    .back{transform:rotateY(180deg);text-align:center}
    .prompt{font-size:20px;font-weight:800}
    .solution{font-size:16px;color:var(--accent);font-weight:700}
    .explain{font-size:13px;color:var(--muted)}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:12px;color:var(--muted);font-size:13px}
    @media (max-width:520px){ .inner{height:140px} .prompt{font-size:18px} .solution{font-size:16px} }
  </style>
</head>
<body>
  <header>
    <h1>Algebra & Precalculus Flashcards</h1>
    <div class="controls">
      <div class="toolbar" role="tablist" aria-label="Decks">
        <button id="deck-alg" class="deck-btn active" role="tab" aria-selected="true">Algebra</button>
        <button id="deck-pre" class="deck-btn" role="tab">Precalculus</button>
      </div>

      <label class="small">
        Cards
        <select id="count">
          <option>6</option><option selected>8</option><option>12</option><option>16</option>
        </select>
      </label>

      <label class="small">
        Difficulty
        <select id="difficulty">
          <option value="low">Beginner</option>
          <option value="mid" selected>Intermediate</option>
          <option value="high">Advanced</option>
        </select>
      </label>

      <button id="newSet">New Set</button>
      <div style="display:flex;align-items:center;"><span id="progress" style="padding:6px 10px;border-radius:999px;background:rgba(19,102,214,.12);color:var(--accent);font-weight:700">0 / 0</span></div>
    </div>
  </header>

  <main class="container">
    <section class="grid" id="cards"></section>
    <footer>Tip: Click or press Enter/Space on a card to flip. Mark "I know this" to fade it.</footer>
  </main>

  <script>
    // Utilities
    function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
    function pick(arr){return arr[randInt(0,arr.length-1)];}
    function gcd(a,b){return b?gcd(b,a%b):Math.abs(a);}
    function simplify(n,d){const g=gcd(n,d);return [n/g,d/g];}

    // Deck generators
    function genAlgebra(difficulty){
      // Difficulty: low (beginner), mid (intermediate), high (advanced but capped)
      const templates = {
        low: [
          ()=>{ // simple linear: solve for x
            const a=randInt(1,9), b=randInt(1,20);
            return {front:`${a}x + ${b} = ${b + randInt(1,10) + a}`, back:`x = ${ ( (b + randInt(1,10) + a) - b )/a }`, explain:`Solve: isolate x.`};
          },
          ()=>{ // one-step: ax = b
            const a=randInt(1,9), x=randInt(1,12);
            return {front:`${a}x = ${a*x}`, back:`x = ${x}`, explain:`Divide both sides by ${a}.`};
          },
          ()=>{ // evaluate expression
            const m=randInt(1,9), n=randInt(1,9);
            return {front:`Evaluate: ${m} (2 + ${n})`, back:`${m*(2+n)}`, explain:`Distribute then multiply.`};
          }
        ],
        mid: [
          ()=>{ // two-step linear
            const a=randInt(1,9), b=randInt(1,20), x=randInt(-8,12);
            const c=a*x + b;
            return {front:`Solve: ${a}x + ${b} = ${c}`, back:`x = ${x}`, explain:`Rearrange and divide by ${a}.`};
          },
          ()=>{ // simple system (substitution)
            const m=randInt(1,5), b=randInt(-5,5);
            const x=randInt(0,8);
            const y= m*x + b;
            return {front:`System: y = ${m}x + ${b};  x = ${x}.  Find y.`, back:`y = ${y}`, explain:`Substitute x into equation.`};
          },
          ()=>{ // factoring quadratics simple
            const r1=randInt(-5,5), r2=randInt(-5,5);
            const a=1, b=-(r1+r2), c=r1*r2;
            return {front:`Factor: x^2 ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c}`, back:`(x ${r1>=0?'-':''}${Math.abs(r1)}) (x ${r2>=0?'-':''}${Math.abs(r2)})`, explain:`Find integer roots ${r1}, ${r2}.`};
          }
        ],
        high: [
          ()=>{ // quadratic formula
            const a=randInt(1,3), b=randInt(-9,9), c=randInt(-9,9);
            const disc = b*b - 4*a*c;
            const front = `Solve: ${a}x^2 ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c} = 0`;
            let back;
            if(disc<0) back = 'No real roots';
            else {
              const r1 = ((-b + Math.sqrt(disc))/(2*a)).toFixed(3);
              const r2 = ((-b - Math.sqrt(disc))/(2*a)).toFixed(3);
              back = `x = ${r1}, ${r2}`;
            }
            return {front, back, explain:`Use quadratic formula.`};
          },
          ()=>{ // rational equation
            const a=randInt(1,6), b=randInt(1,9), x=randInt(1,8);
            const val = (a/(x) + b);
            return {front:`Solve for x: ${a}/x + ${b} = ${ (a/x + b).toFixed(3) } (value)`, back:`x = ${x}`, explain:`Rearrange and solve (example).`};
          }
        ]
      };

      const pool = templates[difficulty];
      return pick(pool)();
    }

    function genPrecalculus(difficulty){
      // mid = intermediate, high = advanced
      const templates = {
        low: [ // intermediate precalc
          ()=>{ // trig eval
            const choices = [
              {q:'sin(π/6)', a:'1/2'},
              {q:'cos(π/3)', a:'1/2'},
              {q:'tan(π/4)', a:'1'}
            ];
            const pickC = pick(choices);
            return {front: `Evaluate: ${pickC.q}`, back: pickC.a, explain:'Use unit circle values.'};
          },
          ()=>{ // exponent rules
            const a=randInt(2,6), m=randInt(1,4), n=randInt(1,4);
            return {front:`Simplify: ${a}^${m} * ${a}^${n}`, back:`${a}^${m+n}`, explain:'Add exponents for same base.'};
          },
          ()=>{ // log basic
            const b=pick([2,10]); const x=randInt(2,8);
            return {front:`Solve: log_${b}(${b**x})`, back:`${x}`, explain:'Logarithm inverse of exponent.'};
          }
        ],
        mid: [ // intermediate-advanced
          ()=>{ // trig identity simplify
            return {front:`Simplify: 1 - sin^2(θ)`, back:`cos^2(θ)`, explain:'Use Pythagorean identity.'};
          },
          ()=>{ // limit
            const n=randInt(1,5);
            return {front:`Limit: lim_{x→0} (sin(x)/x)`, back:`1`, explain:'Standard limit.'};
          },
          ()=>{ // sequence / series basic
            const a1=randInt(1,5), r=randInt(2,5), n=randInt(3,6);
            const an = a1 * Math.pow(r, n-1);
            return {front:`Geometric seq: a1=${a1}, r=${r}. Find a_${n}`, back:`${an}`, explain:'Multiply by r^(n-1).'};
          }
        ],
        high: [
          ()=>{ // composite trig
            return {front:`Prove/transform: tan^2(x)+1`, back:`sec^2(x)`, explain:'Identity: 1+tan^2=sec^2.'};
          },
          ()=>{ // advanced limit
            return {front:`Limit: lim_{x→∞} ( (2x^2+3)/(x^2-1) )`, back:`2`, explain:'Divide leading coefficients.'};
          },
          ()=>{ // inverse trig solve
            return {front:`Solve: sin^{-1}(1/2) (principal)`, back:`π/6`, explain:'Arcsin(1/2) = π/6.'}
          }
        ]
      };
      const pool = templates[difficulty];
      return pick(pool)();
    }

    // App state
    const deckAlgBtn = document.getElementById('deck-alg');
    const deckPreBtn = document.getElementById('deck-pre');
    const difficultyEl = document.getElementById('difficulty');
    const countEl = document.getElementById('count');
    const newSetBtn = document.getElementById('newSet');
    const cardsEl = document.getElementById('cards');
    const progressEl = document.getElementById('progress');

    let activeDeck = 'algebra';
    function setActiveDeck(d){
      activeDeck = d;
      deckAlgBtn.classList.toggle('active', d==='algebra');
      deckAlgBtn.setAttribute('aria-selected', d==='algebra');
      deckPreBtn.classList.toggle('active', d==='precalc');
      deckPreBtn.setAttribute('aria-selected', d==='precalc');
      makeSet();
    }
    deckAlgBtn.addEventListener('click', ()=> setActiveDeck('algebra'));
    deckPreBtn.addEventListener('click', ()=> setActiveDeck('precalc'));

    function generateCard(){
      const diff = difficultyEl.value;
      if(activeDeck==='algebra') return genAlgebra(diff);
      return genPrecalculus(diff==='low'?'low':(diff==='mid'?'mid':'high'));
    }

    let cardData = [];
    let seen = 0, known = 0;

    function makeSet(){
      const n = parseInt(countEl.value,10) || 8;
      cardData = [];
      seen = 0; known = 0;
      for(let i=0;i<n;i++) cardData.push(generateCard());
      render();
      updateProgress();
    }

    function render(){
      cardsEl.innerHTML = '';
      cardData.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="inner" role="button" tabindex="0" aria-pressed="false">
            <div class="face front">
              <div class="prompt">${c.front}</div>
              <div class="small">Click to flip</div>
            </div>
            <div class="face back">
              <div class="solution">${c.back}</div>
              <div class="explain">${c.explain || ''}</div>
              <div style="margin-top:8px;">
                <button class="showAgain">Show again</button>
                <button class="markKnown" style="margin-left:6px;background:var(--ok);color:white;border:none;padding:8px;border-radius:8px;cursor:pointer">I know this</button>
              </div>
            </div>
          </div>`;
        const inner = card.firstElementChild;
        inner.addEventListener('click', ()=> {
          card.classList.toggle('flip');
          const pressed = inner.getAttribute('aria-pressed') === 'true';
          inner.setAttribute('aria-pressed', String(!pressed));
          if(card.classList.contains('flip') && !card.classList.contains('revealed')){
            card.classList.add('revealed'); seen++; updateProgress();
          }
        });
        inner.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); inner.click(); }});
        card.querySelector('.showAgain').addEventListener('click',(ev)=>{ ev.stopPropagation(); card.classList.remove('flip'); });
        card.querySelector('.markKnown').addEventListener('click',(ev)=>{ ev.stopPropagation(); if(!card.classList.contains('known')){ card.classList.add('known'); card.style.opacity='0.45'; card.style.filter='grayscale(.2)'; known++; updateProgress(); }});
        cardsEl.appendChild(card);
      });
    }

    function updateProgress(){ progressEl.textContent = `Seen ${seen} / ${cardData.length} • Known ${known}`; }

    newSetBtn.addEventListener('click', makeSet);
    difficultyEl.addEventListener('change', makeSet);
    countEl.addEventListener('change', makeSet);

    makeSet();
  </script>
</body>
</html>
